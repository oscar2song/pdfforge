name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.2.0)'
        required: true
        type: string
      confirm:
        description: 'Type YES to confirm you want to create a release for this tag'
        required: true
        type: string
        default: 'NO'
      draft:
        description: 'Create the GitHub Release as a draft first?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify confirmation is YES
        run: |
          if [ "${{ inputs.confirm }}" != "YES" ]; then
            echo "Confirmation failed. You must type YES to proceed." >&2
            exit 1
          fi

      - name: Validate tag format (SemVer)
        run: |
          TAG="${{ inputs.tag }}"
          if ! echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid tag format: $TAG. Expected vMAJOR.MINOR.PATCH with optional pre-release (e.g., v2.2.1 or v2.2.1-rc1)." >&2
            exit 1
          fi

      - name: Verify tag exists
        run: |
          git fetch --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/${{ inputs.tag }}"; then
            echo "Tag ${{ inputs.tag }} not found. Please create and push the tag before running this workflow." >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # If your tests need extras, add them here (e.g., pip install -r requirements-dev.txt)

      - name: Run smoke tests
        run: |
          pytest -q

      - name: Set up QEMU (for multi-arch, optional)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build --pull --tag pdfforge:${{ inputs.tag }} .

  release:
    name: Create GitHub Release with autogenerated notes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release already exists
        id: check_release
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.TAG,
              });
              core.setOutput('exists', 'true');
            } catch (e) {
              if (e.status === 404) {
                core.setOutput('exists', 'false');
              } else {
                throw e;
              }
            }

      - name: Create Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          draft: ${{ inputs.draft }}
          prerelease: ${{ contains(inputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip (release already exists)
        if: steps.check_release.outputs.exists == 'true'
        run: echo "Release for tag ${{ inputs.tag }} already exists. Skipping creation."
