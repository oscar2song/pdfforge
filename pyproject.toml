[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfforge"
version = "3.0.0"
description = "PDFForge Professional PDF Processing Tools"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "pdfplumber>=0.11.0",
    "pillow>=12.0.0",
    "PyMuPDF>=1.23.0",
    "pytesseract>=0.3.0",
    "Werkzeug>=3.0.0",
    "python-dotenv>=1.0.0",
    "PyPDF2>=3.0.0",
    "pdf2docx>=0.5.0",
    "python-docx>=1.1.0",
    "requests>=2.32.0",
]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=pdfforge --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
